name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - run: uv sync --locked
      - run: uv run python tests/fetch_spec.py
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run pytest -q
      - run: uv run python examples/verify.py

      - run: uv build
      - run: uv publish
