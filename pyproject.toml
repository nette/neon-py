[project]
name = "nette-neon"
version = "0.1.0"
description = "NEON parser, encoder and lossless editor: change a value in a config file and keep its comments and formatting."
license = "MIT"
license-files = ["license.md"]
authors = [{ name = "David Grudl" }]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neon"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16", "ty>=0.0.84"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["B", "C4", "I", "PIE", "RET", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
