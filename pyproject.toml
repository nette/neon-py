[project]
name = "nette-neon"
version = "1.0.0"
description = "NEON parser, encoder and lossless editor: change a value in a config file and keep its comments and formatting."
readme = "readme.md"
license = "MIT"
license-files = ["license.md"]
authors = [{ name = "David Grudl" }]
requires-python = ">=3.13"
keywords = ["neon", "nette", "parser", "config", "format-preserving", "round-trip", "cst"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development :: Libraries",
	"Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://neon.nette.org"
Repository = "https://github.com/nette/neon-py"

[project.scripts]
neon-lint = "neon.lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neon"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16", "ty>=0.0.84"]

[tool.ruff]
target-version = "py313"

[tool.ruff.format]
exclude = ["*.md"]  # the comments of the samples in readmes are aligned by hand

[tool.ruff.lint]
extend-select = ["B", "C4", "I", "PIE", "RET", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
